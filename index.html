<title>DIG DEEPER Timer</title>

<style>
/* Layout: Ember Coach. One phone-width column of soft rounded cards; home → player → summary swap in place. */
:root{
  --bg:#F5F1EA; --card:#FFFFFF; --ink:#1A1714; --muted:#6A6158; --line:#E5DED3;
  --accent:#FF6A2B; --accent-ink:#1F0E04; --accent-soft:#FFE6D8; --accent-text:#B93D0A;

  --good:#0F5C46; --good-soft:#DCF1E8; --warm:#7A5300; --warm-soft:#FFF1D6;
  --shadow:0 10px 30px rgba(22,32,42,.07);

  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12100E; --card:#1F1B17; --ink:#F7F3EE; --muted:#AEA498; --line:#38312B;
  --accent:#FF7A3D; --accent-ink:#1F0E04; --accent-soft:#3D2316; --accent-text:#FFA070;
  --hero:#2A231D; --hero-ink:#FFFFFF;
  --good:#6BE8B6; --good-soft:#12372B; --warm:#F2B24C; --warm-soft:#3A2D14; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12100E; --card:#1F1B17; --ink:#F7F3EE; --muted:#AEA498; --line:#38312B;
  --accent:#FF7A3D; --accent-ink:#1F0E04; --accent-soft:#3D2316; --accent-text:#FFA070;

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.cols{display:flex;flex-direction:column;gap:18px}

.narrow{display:flex;flex-direction:column;gap:18px;width:100%;max-width:620px;margin:0 auto}
@media (min-width:900px){.wrap{max-width:1160px!important;padding-block:32px 48px}.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px;align-items:start}.colA,.colB{gap:20px}.hello h1{font-size:2.3rem}.move h1{font-size:2.1rem}.top{max-width:none}.cols .nextcard{grid-template-columns:1fr;padding:14px}.cols .nextcard h2{font-size:1.6rem}.colB>.note{font-size:.95rem}}
.wrap{max-width:520px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:22px 40px;display:flex;flex-direction:column;gap:18px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

.grid{display:grid;grid-template-columns:3.2rem repeat(6,minmax(0,1fr));gap:5px;padding-bottom:16px;font-variant-numeric:tabular-nums}

.cell{height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0}

.list{display:flex;flex-direction:column;padding-bottom:10px}

.seg button{border:0;background:transparent;border-radius:12px;padding:9px 4px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button small{display:block;font-weight:500;font-size:.72rem}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink)}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:3rem 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--card);border:0;border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.day .dw{font-weight:700;color:var(--accent-text);font-size:.9rem}
.day b{display:block;font-weight:600}
.day small{color:var(--muted)}

.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}

.status.warn{color:var(--muted)}

/* player */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex-shrink:0}

.clock{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.move{overflow:hidden}
.shot{aspect-ratio:3/2;max-width:100%;background:var(--bg);cursor:zoom-in;position:relative}

.fsapp{margin-left:8px}
.top .clock{margin-left:auto}

.hello{display:flex;flex-direction:column}
.half{display:none}
/* full screen mode */
body.fsmode .wrap{max-width:none!important;padding-block:10px 20px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

@media (orientation:portrait){

  body.fsmode .shot img{display:none}
  body.fsmode .shot .half{display:block;width:100%;max-width:min(100%,calc(36vh*.75));aspect-ratio:.75;margin:0 auto;background-size:200% 100%;background-position:0 50%;background-repeat:no-repeat;border-radius:12px}
  body.fsmode .shot .half.r{background-position:100% 50%}
  body.fsmode .cols .move.card,body.fsmode .cols.rest .nextcard{margin-inline:-10px}

  body.fsmode .cols.rest .ring svg{width:120px;height:120px}
}

@media (orientation:landscape){
  body.fsmode .cols,body.fsmode .cols.rest{display:grid!important;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:14px;align-items:start}

  body.fsmode .move h1{font-size:1.15rem}
  body.fsmode .move .body p{display:none}
  body.fsmode .move .shot img{object-fit:contain}
  body.fsmode .cols.rest{grid-template-columns:minmax(280px,1fr) minmax(0,1.7fr)}
  body.fsmode .cols.rest .nextcard .shot{aspect-ratio:3/2;height:auto;max-height:calc(100vh - 140px);min-height:180px}
  body.fsmode .cols.rest .ring{width:140px!important;height:140px!important}
  body.fsmode .cols.rest .ring svg{width:140px;height:140px}
  body.fsmode .top{margin-bottom:-6px}
}
.fsbtn{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:rgba(10,14,20,.72);color:#fff;font-weight:700;font-size:.85rem;padding:9px 14px;min-height:40px}

.pmtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pmname{display:flex;flex-direction:column;min-width:0}
.pmname span{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#FFA070}

.pmname b{font-family:var(--f-display);font-size:clamp(1.1rem,4.5vw,1.8rem);line-height:1.1}
.pmnum{text-align:right;flex-shrink:0}
.pmnum b{display:block;font-family:var(--f-display);font-size:clamp(1.8rem,7vw,3rem);line-height:1;font-variant-numeric:tabular-nums}
.pmnum span{font-size:.8rem;color:#C9C0B5}
.pmimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.pmimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.pmhalf{display:none}
@media (orientation:portrait){.pmimg{flex-direction:column;gap:8px}.pmimg img{display:none}.pmhalf{display:block;flex:1;min-height:0;width:100%;max-width:calc((100vh - 200px)/2*.75);aspect-ratio:.75;margin:0 auto;background-size:200% 100%;background-position:0 50%;background-repeat:no-repeat;border-radius:10px}.pmhalf.r{background-position:100% 50%}}
.pmbar{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.pmb{height:54px;border:0;border-radius:16px;background:#FF6A2B;color:#1F0E04;font-family:var(--f-display);font-weight:700;font-size:1.05rem}

@media (max-width:899px){.cols .move.card,.cols.rest .nextcard{margin-inline:calc(-1*max(18px,env(safe-area-inset-left,0px)));border-radius:0}.cols .move.card .shot{aspect-ratio:auto}}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

@media (max-width:899px){.move.card{margin-inline:-10px;border-radius:22px}.cols.rest .colA,.cols.rest .colB{display:contents}.cols.rest .timer{order:1;padding:16px 18px}.cols.rest .nextcard{order:2;margin-inline:-10px}.cols.rest .edit{order:3}.cols.rest>.colB>.note,.cols.rest .note.setup{order:4}.cols.rest .ring{width:150px!important;height:150px!important}.cols.rest .ring svg{width:150px;height:150px}.cols.rest .timer .mid b{font-size:2.8rem}}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.move .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;color:var(--accent-text);background:var(--accent-soft);padding:5px 11px;border-radius:999px}

.target{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.pick{display:flex;flex-direction:column;gap:8px}
.pick .lab{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;color:var(--muted)}
.wrap>*,.pick,.pick>*{min-width:0;max-width:100%}

.row3{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:14px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}

.wasline b{color:var(--ink)}
/* body stats */
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:12px}
.bst{background:var(--bg);border-radius:16px;padding:10px 12px;min-width:0}
.bst b{display:block;font-family:var(--f-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.bst span{font-size:.78rem;color:var(--muted)}
.bst small{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.bst.hi b{color:var(--accent-text)}
.spark{display:block;width:100%;height:56px;margin:0 0 12px}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark .gl{stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 4}
.wrow{display:flex;gap:8px;align-items:flex-end;padding-bottom:12px;flex-wrap:wrap}
.wrow label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);flex:1;min-width:120px}
.bin{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font:inherit;font-size:1.05rem;color:var(--ink);width:100%;box-sizing:border-box}
.bin:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:10px}
.pgrid label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
/* coach */
.coach{display:flex;flex-direction:column;gap:10px}
.coachtxt{margin:0;white-space:pre-line;font-size:.95rem;line-height:1.5}
.coach .sm{align-self:flex-start}
.coach .sm:disabled{opacity:.6}
/* move review sheet (before starting a workout) */
button.li.mv{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer}
button.li.mv .num::after{content:"›";margin-left:8px;font-size:1.2rem;color:var(--muted)}
.rv{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.rvs{position:relative;background:var(--bg);width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:0 0 max(18px,env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.rv{align-items:center}.rvs{border-radius:26px}}
.rvs .shot{aspect-ratio:3/2;background:#12100E;border-radius:26px 26px 0 0;overflow:hidden;cursor:zoom-in}
.rvs .shot img{width:100%;height:100%;object-fit:contain;display:block}
.rvb{padding:16px 18px 0;display:flex;flex-direction:column;gap:12px}
.rvb h2{font-size:1.6rem;line-height:1.1}
.rvb p{margin:0}
.rvsets{display:flex;gap:6px;flex-wrap:wrap}
.rvsets span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.rvnav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rvnav button{height:48px;border:0;border-radius:14px;background:var(--card);font-weight:700;color:var(--ink)}
.rvnav button:disabled{opacity:.35}
.rvx{position:absolute;z-index:3;margin:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(10,14,20,.7);color:#fff;font-size:1.3rem;line-height:1}
/* keep the photo on the same side during work and rest */
@media (min-width:900px){.cols.rest>.colB{order:-1}}
@media (orientation:landscape){body.fsmode .cols.rest{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}body.fsmode .cols.rest>.colB{order:-1;position:sticky;top:8px}body.fsmode .cols.rest>.colA{position:static}}

function repsFor(e,i){

        st.push({t:"work",tp:TEMPO[c.slice(0,2)]||3,ex:e.ex,note:e.note,dur:e.dur,reps:repsFor(e,si),set:si,sets:e.sets,round:r,rounds,circuit});

  if(paced()&&VID[c.slice(0,2)+"|"+d]){
    const work=out.filter(s=>s.t==="work").reduce((a,s)=>a+(s.dur||repCount(s.reps)*s.tp+3),0);

}

const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayMs=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).getTime()};

function bodyStats(){
  if(!WEIGH.length)return null;
  const cur=WEIGH[WEIGH.length-1],first=WEIGH[0],lb=cur.lb,kg=lb*0.45359,cm=BODY.hin*2.54;
  const bmi=703*lb/(BODY.hin*BODY.hin);
  const bmr=10*kg+6.25*cm-5*BODY.age+(BODY.sex==="f"?-161:5);
  // trend: least-squares slope over the last 28 days of weigh-ins
  const end=dayMs(cur.day),pts=WEIGH.filter(x=>dayMs(x.day)>=end-28*864e5).map(x=>[(dayMs(x.day)-end)/864e5,x.lb]);
  let rate=null;
  if(pts.length>=3&&pts[pts.length-1][0]-pts[0][0]>=6){
    const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;
    const sxx=pts.reduce((a,p)=>a+(p[0]-mx)**2,0),sxy=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0);
    if(sxx>0)rate=sxy/sxx*7;
  }

  const eta=rate!=null&&rate<-0.05&&toGoal>0?Date.now()+toGoal/(-rate)*7*864e5:null;
  // last 7 days of lifting, and calories for a typical finished workout (MET 5, circuit-style dumbbell work)
  const wk=Date.now()-7*864e5,recent=SESS.filter(s=>s.date>=wk);
  const done=SESS.filter(s=>!s.partial&&s.ms>0).slice(0,5);
  const avgMs=done.length?done.reduce((a,s)=>a+s.ms,0)/done.length:null;
  const wkcal=avgMs?5*kg*avgMs/3.6e6:null;
  return{lb,day:cur.day,first,bmi,bmr,liftDay:bmr*1.55,restDay:bmr*1.3,rate,toGoal,eta,wkcal,
    wkVol:recent.reduce((a,s)=>a+(s.vol||0),0),wkSets:recent.reduce((a,s)=>a+(s.sets||0),0),wkN:recent.filter(s=>!s.partial).length};
}
function spark(){

      if(v.w!=null&&weighted(l.ex)){l.w=v.w;P.wsel[l.ex]=v.w}if(v.r!=null&&l.target)l.reps=Math.min(l.target,v.r);
      saveRes();savePartial();render();say(`Fixed. ${l.w?l.w+" pounds":""}${l.reps!=null?", "+l.reps+" reps":""}.`,false,"",true)}
  }
}
if(window.__session){
  window.__session.onAction(remoteAction);
  window.__session.onTick(()=>{if(P&&P.started&&!P.done&&tick)loop()});
}

/* ---------- Heart rate from the watch (via Health Connect) ---------- */
function hrCalories(avg,min){const kg=(WEIGH.length?WEIGH[WEIGH.length-1].lb:190)*0.45359,a=BODY.age||30;
  const perMin=BODY.sex==="f"?(-20.4022+0.4472*avg-0.1263*kg+0.074*a)/4.184:(-55.0969+0.6309*avg+0.1988*kg+0.2017*a)/4.184;
  return Math.max(0,Math.round(perMin*min))}
async function readHR(start,end){
  if(!window.__hc||S.hc!=="on"||!window.__hc.readHeartRate)return null;
  try{const r=await Promise.race([window.__hc.readHeartRate({start:Math.round(start),end:Math.round(end)}),new Promise(res=>setTimeout(()=>res(null),6000))]);
    const xs=(r&&r.samples||[]).map(x=>x.bpm).filter(b=>b>30&&b<230);if(xs.length<5)return null;
    const avg=Math.round(xs.reduce((a,b)=>a+b,0)/xs.length),max=Math.max(...xs);
    return{avg,max,n:xs.length,kcal:hrCalories(avg,(end-start)/60000),pts:(r.samples||[]).filter(x=>x.bpm>30&&x.bpm<230).map(x=>[x.time,x.bpm])}}catch(e){return null}
}
function hrCard(hr){
  if(!hr)return"";
  const W=300,H=60,pts=hr.pts||[];let svg="";
  if(pts.length>2){const t0=pts[0][0],t1=pts[pts.length-1][0]||t0+1,lo=Math.min(...pts.map(p=>p[1]))-5,hi=Math.max(...pts.map(p=>p[1]))+5;
    svg=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Heart rate over the workout"><polyline class="ln" points="${pts.map(p=>((p[0]-t0)/(t1-t0||1)*W).toFixed(1)+","+(H-(p[1]-lo)/(hi-lo)*H).toFixed(1)).join(" ")}"/></svg>`}
  return`<div class="card pad"><div class="sect" style="margin:0 0 8px">Heart rate</div><div class="bgrid"><div class="bst"><b>${hr.avg}</b><span>Average bpm</span></div><div class="bst"><b>${hr.max}</b><span>Peak bpm</span></div><div class="bst hi" style="grid-column:1/-1"><b>~${hr.kcal.toLocaleString()} calories</b><span>Based on your heart rate</span></div></div>${svg}</div>`;
}
async function hrBackfill(){
  if(!window.__hc||S.hc!=="on")return;
  const want=SESS.filter(s=>!s.partial&&!s.hr&&s.ms>60000&&s.date>Date.now()-4*864e5&&!(s.hrTries>=6)).slice(0,5);
  let changed=false;
  for(const s of want){const hr=await readHR(s.date-s.ms,s.date);s.hrTries=(s.hrTries||0)+1;if(hr){const {pts,...keep}=hr;s.hr=keep;changed=true}upsertSess(s)}
  if(changed&&VIEW==="home"){const op=[...$$("details[open]")].map(d=>d.id);home();op.forEach(id=>{const d=id&&document.getElementById(id);if(d)d.open=true})}
}
/* ---------- Delete data and reset (photos stay) ---------- */
const KEEP_ON_RESET=["ddt-photos","ddt-photobase"];
function askWipe(){
  closeReview();
  const el=document.createElement("div");el.className="rv";el.id="rv";
  el.innerHTML=`<div class="rvs" role="dialog" aria-modal="true" aria-label="Delete my data and reset" style="padding:22px 18px max(18px,env(safe-area-inset-bottom,0px))">
    <button class="rvx" id="rvx" aria-label="Close" style="right:0;top:0">×</button>
    <div class="rvb" style="padding:0">
      <h2>Delete everything and start fresh?</h2>
      <p>This erases every workout you've logged, your weights, body stats, the 12-week tracker and your settings on this phone. The app restarts at the intro.</p>
      <p class="muted"><b>Kept:</b> your saved move photos, so nothing re-downloads. Anything already sent to Health Connect stays there.</p>
      <button class="sm sec" id="wbk" style="width:100%;background:var(--card);margin-top:28px">Download a backup first</button><span class="note" id="bkmsg" style="margin:0"></span>
      <label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" id="wok" style="width:22px;height:22px;accent-color:#B42318">I understand this can't be undone</label>
      <button class="big" id="wgo" disabled style="background:#B42318;color:#fff;opacity:.45">Delete and reset</button>
    </div></div>`;
  document.body.appendChild(el);
  el.onclick=e=>{if(e.target===el)closeReview()};
  $("#rvx").onclick=closeReview;
  $("#wbk").onclick=backup;
  $("#wok").onchange=()=>{const on=$("#wok").checked;$("#wgo").disabled=!on;$("#wgo").style.opacity=on?1:.45};
  $("#wgo").onclick=wipeAll;
}
function wipeAll(){
  try{stopAll()}catch(e){}
  try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("ddt-")&&!KEEP_ON_RESET.includes(k))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(e){}
  location.reload();
}
/* ---------- Review a move before starting ---------- */
function openReview(i){
  const m=P.moves[i];if(!m)return;
  const steps=P.steps.filter(x=>x.t==="work"&&x.ex===m),s0=steps[0]||{};
  const tg=steps.map(x=>x.dur?(x.dur>=120?Math.round(x.dur/60)+" min":x.dur+" s"):maxReps(x)+" reps");
  const PV=(()=>{for(const s of SESS){const L=(s.log||[]).filter(l=>l.ex===m);if(L.length)return{date:s.date,sets:L}}return null})();
  const L=lastInfo(m),pic=IMG[m];
  const last=PV?PV.sets.map((l,k)=>`<span>${k+1}: ${l.w?l.w+" lb":""}${l.w&&l.reps!=null?" × ":""}${l.reps!=null?l.reps:(l.w?"":"done")}</span>`).join(""):"";
  const el=document.createElement("div");el.className="rv";el.id="rv";
  el.innerHTML=`<div class="rvs" role="dialog" aria-modal="true" aria-label="${esc(m)}">
    <button class="rvx" id="rvx" aria-label="Close">×</button>
    ${pic?`<div class="shot" id="rvpic"><img src="${pic}" alt="${esc(m)} start and finish"></div>`:""}
    <div class="rvb">
      <div><span class="kick muted">Move ${i+1} of ${P.moves.length}${s0.note?" · "+esc(s0.note):""}</span><h2>${esc(m)}</h2></div>
      <div class="rvsets">${tg.map((t,k)=>`<span>${steps.length>1?(s0.circuit?"Round ":"Set ")+(k+1)+": ":""}${t}</span>`).join("")}</div>
      ${SETUP[m]?`<p>${esc(SETUP[m])}</p>`:""}
      ${weighted(m)?`<div class="card pad" style="padding:14px 16px"><b style="display:block;margin-bottom:6px">Last time${PV?" · "+fmtDate(PV.date):""}</b>${PV?`<div class="rvsets">${last}</div>`:`<span class="note" style="margin:0">No log yet. Pick your weight when the set starts.</span>`}${L&&L.next?`<p class="up" style="margin-top:8px">You hit every rep. Try ${L.next} lb.</p>`:""}</div>`:""}
      <div class="rvnav"><button id="rvp" ${i===0?"disabled":""}>‹ Prev</button><button id="rvh">Hear it</button><button id="rvn" ${i===P.moves.length-1?"disabled":""}>Next ›</button></div>
    </div></div>`;
  closeReview();document.body.appendChild(el);
  const close=()=>{closeReview();try{speechSynthesis.cancel()}catch(e){}};
  el.onclick=e=>{if(e.target===el)close()};
  $("#rvx").onclick=close;
  $("#rvp").onclick=()=>openReview(i-1);$("#rvn").onclick=()=>openReview(i+1);
  $("#rvh").onclick=()=>say(`${m}. ${tg.join(", ")}.`,true,spoken(m));
  const pc=$("#rvpic");if(pc)pc.onclick=()=>{const lb=document.createElement("div");lb.className="lb";lb.style.zIndex=75;lb.innerHTML=`<b>${esc(m)}</b><img src="${pic}" alt="">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb)};
}
function closeReview(){const r=$("#rv");if(r)r.remove()}
function closePM(){P.pm=false;const d=$("#pm");if(d)d.remove();try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){};try{screen.orientation.unlock()}catch(e){}}
function drawPM(){
  if(!P)return;const s=P.steps[P.i];if(!s){closePM();return}
  const work=s.t==="work",show=work?s:upcoming(P.i);if(!show){closePM();return}
  const pic=IMG[show.ex];
  const status=!P.started?"Ready":work?(s.circuit?`Round ${s.round} of ${s.rounds}`:s.sets>1?`Set ${s.set} of ${s.sets}`:"Go"):(s.t==="prep"?"Get ready":"Rest · up next");
  const amt=show.dur?show.dur+" s":show.reps+(/^\d+$/.test(show.reps)?" reps":"");
  const w=weighted(show.ex)?pickW(show.ex):null;
  const act=!P.started?"Start":work?(P.total?(P.paused?"Resume":"Pause"):"Set done"):(s.t==="prep"?"Start now":"Skip rest");
  let d=$("#pm");if(!d){d=document.createElement("div");d.id="pm";d.className="pm";d.setAttribute("role","dialog");d.setAttribute("aria-label","Full screen photo");document.body.appendChild(d)}
  d.className="pm"+(work?"":" resting");
  d.innerHTML=`<div class="pmtop"><div class="pmname"><span>${status}</span><b>${esc(show.ex)}</b></div><div class="pmnum"><b id="pmt">${P.total&&P.started?Math.ceil(P.left):(work?esc(s.reps||""):"")}</b><span>${amt}${w?" · "+w+" lb":""}</span></div></div>
    <div class="pmimg">${pic?`<img src="${pic}" alt="${esc(show.ex)} start and finish positions"><div class="pmhalf" style="background-image:url('${pic}')" aria-hidden="true"></div><div class="pmhalf r" style="background-image:url('${pic}')" aria-hidden="true"></div>`:`<p>No photo yet</p>`}</div>
    <div class="pmbar"><button class="pmb sec" id="pmx">Exit full screen</button><button class="pmb" id="pma">${act}</button></div>`;
  $("#pmx").onclick=closePM;
  $("#pma").onclick=()=>{if(!P.started||work)main();else enter(P.i+1)};
  paint();
}
function paint(){
  const pmt=$("#pmt");
  if(pmt&&P&&P.started&&P.total){const s=P.steps[P.i];if(s.t==="work"&&!s.dur){const ph=repPhase(s);pmt.textContent=ph.lead?"–":ph.rep+" / "+maxReps(s)}else pmt.textContent=Math.ceil(P.left)}
  if(!P||!P.total||!P.started)return;
  const rv=$("#rv"),tv=$("#tv");if(!rv||!tv)return;
  const s=P.steps[P.i];
  if(s.t==="work"&&!s.dur){const ph=repPhase(s),tl=$("#tl");tv.textContent=ph.lead?"–":ph.rep;if(tl)tl.textContent=ph.lead?"get set":`of ${maxReps(s)}${s.tp>=4?(ph.down?" · down":" · up"):""}`}
  else tv.textContent=Math.ceil(P.left);
  rv.style.strokeDashoffset=(+rv.dataset.c*(1-P.left/P.total)).toFixed(1);
}

/* ---------- Summary ---------- */
function finish(){
  stopAll();beep(1046,300);
  const plan={};P.steps.forEach(s=>{if(s.t==="work")plan[s.ex]=(plan[s.ex]||0)+1});
  const by={};P.log.forEach(l=>{const b=by[l.ex]=by[l.ex]||{n:0,short:false,ws:[],reps:[]};b.n++;if(l.target&&l.reps<l.target)b.short=true;if(l.w)b.ws.push(l.w);if(l.reps!=null)b.reps.push(l.reps)});
  const ups=[],lines=[];
  Object.keys(by).forEach(ex=>{const b=by[ex];const hit=b.n>=plan[ex]&&!b.short;
    if(!b.ws.length){lines.push({ex,w:null,hit,reps:b.reps,n:b.n});return}
    const w=b.ws[b.ws.length-1],prev=LAST[ex];
    LAST[ex]={w,hit,reps:b.reps[b.reps.length-1]??null,date:Date.now()};saveLift(ex);
    const n=hit?WEIGHTS.find(x=>x>w):null;if(n)ups.push({ex,w,n});
    lines.push({ex,w,prev:prev&&prev.w,hit,reps:b.reps,n:b.n});
  });
  const vol=P.log.reduce((a,l)=>a+(l.w&&l.reps?l.w*l.reps:0),0),sets=P.log.length;
  const kgNow=WEIGH.length?WEIGH[WEIGH.length-1].lb*0.45359:null,kcal=kgNow?Math.round(5*kgNow*P.ms/3.6e6):null;
  const now=Date.now();
  clearTimeout(pTimer);P.done=true;upsertSess({...sessObj(false),date:now});
  if(P.week){TR[P.week+"-"+P.d]=now;saveRound()}
  VIEW="summary";
  store("ddt-resume",null);
  if(window.__hc&&S.hc==="on"&&P.ms>60000){const sid=P.sid,ms=P.ms,w=P.w;(async()=>{
    const hr=await readHR(now-ms,now),el=$("#hrcard");
    if(hr){if(el)el.innerHTML=hrCard(hr);const ss=SESS.find(x=>x.id===sid);if(ss){const {pts,...keep}=hr;ss.hr=keep;upsertSess(ss)}}
    else if(el)el.innerHTML=`<p class="note" style="margin:0">Heart rate from your watch hasn't reached Health Connect yet. It'll show in Recent workouts once it syncs.</p>`;
    window.__hc.saveWorkout({start:Math.round(now-ms),end:now,title:"DIG DEEPER · "+w,kcal:(hr?hr.kcal:kcal)||0}).then(()=>{const m=$("#hcmsg");if(m)m.textContent="Saved to Health Connect."},()=>{const m=$("#hcmsg");if(m)m.textContent="Couldn't save to Health Connect."});
  })()}
  say(`Workout complete${S.name?", "+S.name:""}. ${sets} sets in ${Math.round(P.ms/60000)} minutes${kcal?", about "+kcal+" calories":""}. Nice work.`);
  window.scrollTo(0,0);
  $("#app").innerHTML=`<div class="narrow"><div class="hello"><span>${P.week?"Week "+P.week+" · ":""}${DAYNAME[P.d]}</span><h1>${esc(P.w)}: done.</h1></div>
    <div class="stats"><div class="card stat"><b>${clock(P.ms)}</b><span>Time</span></div><div class="card stat"><b>${sets}</b><span>Sets</span></div><div class="card stat"><b>${vol?vol.toLocaleString():"–"}</b><span>Pounds lifted</span></div></div>
    ${kcal?`<div class="card pad" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span><b style="font-family:var(--f-display);font-size:1.6rem">~${kcal.toLocaleString()}</b> <span class="muted">calories burned</span></span><span class="note" style="text-align:right">Estimate from your weight and workout time</span></div>`:`<p class="note" style="margin:0">Add your weight under Body stats to see calories burned.</p>`}
    <div id="hrcard"></div>
    <p class="note" style="margin:0">Pounds lifted is dumbbell weight × reps for each set you logged. <span id="hcmsg"></span></p>
    ${ups.length?`<div class="card pad"><div class="sect" style="margin:0 0 6px">Go up next time</div><div class="list">${ups.map(u=>`<div class="li"><span>${esc(u.ex)}</span><span class="up">${u.w} → ${u.n} lb</span></div>`).join("")}</div></div>`:""}
    ${lines.length?`<div class="card pad"><div class="sect" style="margin:0 0 6px">What you did</div><div class="list">${lines.map(l=>`<div class="li"><span>${esc(l.ex)}<small>${l.reps.length?"Reps: "+l.reps.join(", "):l.n+" set"+(l.n>1?"s":"")}${l.hit?"":" · short of target"}</small></span><span class="num">${l.w?(l.prev&&l.prev!==l.w?l.prev+" → ":"")+l.w+" lb":weighted(l.ex)?"No weight":l.reps.length?"Body":"Timed"}</span></div>`).join("")}</div></div>`:""}
    <button class="big" id="back">Back to home</button></div>`;
  $("#back").onclick=home;
}
{const _r=render;render=function(){_r();sessionSync()}}
home();
connectDB();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
