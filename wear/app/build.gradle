plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ddtCode = Integer.parseInt(String.valueOf(project.findProperty("ddtVersionCode") ?: "1"))

android {
    namespace "com.aykaufman.digdeeper"
    compileSdk 34
    defaultConfig {
        // must match the phone app so the two can talk over the watch connection
        applicationId "com.aykaufman.digdeeper"
        minSdk 30
        targetSdk 34
        versionCode ddtCode
        versionName "1." + ddtCode
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
}
