name: Build Android app

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: |
          mkdir build && cd build
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/android@6 @capacitor/app@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor-community/text-to-speech@4 @capawesome-team/capacitor-file-opener@6
          npm i -D @capacitor/cli@6 @capacitor/assets@3 esbuild
          npm i "$(npm pack ../native/healthconnect --silent)"
          mkdir www assets
          cp ../native/capacitor.config.json ../native/native.js .
          node ../native/make-index.js ../index.html www/index.html
          npx esbuild native.js --bundle --format=iife --outfile=www/native.js
          npx cap add android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 26/' android/variables.gradle
          cp ../native/icon-only.png ../native/icon-foreground.png ../native/icon-background.png assets/
          npx @capacitor/assets generate --android --iconBackgroundColor '#1A1714' --splashBackgroundColor '#F5F1EA'
          cp ../native/MainActivity.java android/app/src/main/java/com/aykaufman/digdeeper/MainActivity.java
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build the APK
        run: cd build/android && ./gradlew assembleRelease --no-daemon

      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets first."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 build/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out dig-deeper-timer.apk aligned.apk
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -lh dig-deeper-timer.apk

      - name: Publish as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Dig Deeper v1.${{ github.run_number }}
          body: "Android app. Download dig-deeper-timer.apk on your phone and open it to install or update."
          files: dig-deeper-timer.apk
          make_latest: true
